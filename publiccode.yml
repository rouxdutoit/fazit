description:
  en:
    shortDescription: Local reports for assessing a move from Microsoft 365 to open source software.
    longDescription: >-
      Fazit helps administrations and other organisations assess a move from
      Microsoft 365. It gives a readiness status and supporting evidence for
      15 areas and compares the five-year costs of staying, moving some areas
      or moving all areas. It produces a single HTML report that can be opened
      and printed offline. The current version runs from source and uses
      bundled samples or an existing scan file. Local import of admin-centre
      exports is planned next. Read-only sign-in will follow later.
    features:
      - Readiness and supporting evidence by area
      - Function mappings for openDesk, Nextcloud and a generic open source setup
      - Five-year cost comparison for staying, partial exit and full exit
      - Offline HTML reports in English and German
  de:
    shortDescription: Lokale Berichte zur Prüfung eines Umstiegs von Microsoft 365 auf Open-Source-Software.
    longDescription: >-
      Fazit unterstützt Verwaltungen und andere Organisationen bei der
      Prüfung eines Umstiegs von Microsoft 365. Der Bericht bewertet 15
      Bereiche einzeln und nennt die jeweiligen Nachweise. Er vergleicht
      die Kosten über fünf Jahre für den Verbleib sowie für einen
      teilweisen oder vollständigen Umstieg. Die HTML-Datei lässt sich
      ohne Internetverbindung öffnen und drucken. Die aktuelle Version
      läuft aus dem Quellcode und verarbeitet Beispieldaten oder eine
      vorhandene Erhebungsdatei. Als Nächstes soll der lokale Import von
      Exporten aus dem Admin Center folgen, später die Anmeldung mit
      reinem Lesezugriff.
    features:
      - Einstufung und Nachweise je Prüfbereich
      - Funktionszuordnungen für openDesk, Nextcloud und ein allgemeines Open-Source-Zielprofil
      - Kostenvergleich über fünf Jahre für Verbleib, teilweisen und vollständigen Umstieg
      - HTML-Berichte auf Deutsch und Englisch, auch ohne Netzwerk lesbar
