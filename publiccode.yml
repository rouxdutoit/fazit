description:
  en:
    shortDescription: Local reports for assessing a move from Microsoft 365 to open source software.
    longDescription: >-
      Fazit is a free, read-only command-line tool for public bodies and other
      organisations assessing a move from Microsoft 365. It runs locally and
      creates one offline HTML report in English or German. The report gives a
      readiness status and evidence for each of 14 areas. It marks missing
      evidence as unknown and compares five-year costs from the figures you
      provide. You can run Fazit from source with bundled sample data or build a
      report from a compatible scan file and inputs.yaml. The sample measurements
      are simulated. Local import of Microsoft 365 admin-centre exports comes
      next. Microsoft sign-in and read-only collection are planned for later.
    documentation: https://fazit.dev/start/
    features:
      - Readiness and supporting evidence by area
      - Function mappings for openDesk, Nextcloud and a generic open source setup
      - Five-year cost comparison for staying, a partial move and a full move
      - Offline HTML reports in English and German
  de:
    shortDescription: Lokale Berichte zur Prüfung eines Umstiegs von Microsoft 365 auf Open-Source-Software.
    longDescription: >-
      Fazit ist ein kostenloses Kommandozeilenprogramm für Verwaltungen und
      andere Organisationen, die einen Umstieg von Microsoft 365 prüfen. Es
      arbeitet lokal und hat keinen Schreibzugriff auf den Mandanten. Der
      offline lesbare HTML-Bericht auf Deutsch oder Englisch stuft 14 Bereiche
      anhand der Nachweise ein. Fehlende Nachweise kennzeichnet er als
      „Unbekannt“. Die Kosten über fünf Jahre berechnet er aus Ihren Angaben.
      Sie können Fazit aus dem Quellcode mit den mitgelieferten Beispieldaten
      starten oder einen Bericht aus einer kompatiblen Erhebungsdatei und
      inputs.yaml erstellen. Die Messwerte in den Beispielen sind simuliert.
      Als Nächstes ist der lokale Import von Exporten aus dem Microsoft 365
      Admin Center vorgesehen. Später folgen die Microsoft-Anmeldung und die
      Erhebung mit reinem Lesezugriff.
    documentation: https://fazit.dev/de/start/
    features:
      - Einstufung und Nachweise je Prüfbereich
      - Funktionszuordnungen für openDesk, Nextcloud und ein allgemeines Open-Source-Zielprofil
      - Kostenvergleich über fünf Jahre für Verbleib, teilweisen und vollständigen Umstieg
      - HTML-Berichte auf Deutsch und Englisch, auch ohne Netzwerk lesbar
