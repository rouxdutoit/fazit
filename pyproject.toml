# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "fazit"
version = "0.1.0"
description = "Build local reports on Microsoft 365 exit readiness."
readme = "README.md"
authors = [{ name = "roux", email = "hello@rouxdutoit.com" }]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later AND OFL-1.1 AND Apache-2.0"
license-files = ["LICENSE", "src/fazit/fonts/OFL.txt", "src/fazit/icons/LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
]

[project.urls]
Homepage = "https://fazit.dev"
Source = "https://github.com/rouxdutoit/fazit"
Issues = "https://github.com/rouxdutoit/fazit/issues"

[project.scripts]
fazit = "fazit.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/fazit",
    "/docs",
    "/tests",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/DECISIONS.md",
    "/LICENSE",
    "/README.md",
    "/README.de.md",
    "/SECURITY.md",
    "/inputs.example.yaml",
    "/publiccode.yml",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fazit"]

[tool.uv]
exclude-newer = "2026-11-07T00:00:00Z"

[tool.ruff]
extend-exclude = [".planning"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S506", "S701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises multiple CLI runs or an installed wheel"]

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
