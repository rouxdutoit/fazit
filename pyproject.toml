# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "fazit"
version = "0.0.0"
description = "Fazit is in development. See https://fazit.dev"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "roux", email = "hello@rouxdutoit.com" }]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://fazit.dev"
Source = "https://github.com/rouxdutoit/fazit"

[project.scripts]
fazit = "fazit:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"
