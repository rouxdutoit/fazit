# SPDX-License-Identifier: AGPL-3.0-or-later
name: Deploy website

"on":
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Get the site files without retaining the GitHub token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Match the minimum Python version used by CI.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      # The checker regenerates demo reports with Fazit and Typer.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      # Validate the site before making any storage changes.
      - name: Check the website
        run: uv run --locked --no-dev --python "${{ steps.python.outputs.python-path }}" python3 site/check_site.py
      # Sync Bunny Storage before optionally purging the CDN cache.
      - name: Deploy to Bunny.net
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: bash .github/scripts/site-deploy.sh
      # Give the CDN a short window to serve both home pages.
      - name: Smoke test the public website
        shell: bash
        run: |
          for url in 'https://fazit.dev/' 'https://fazit.dev/de/'; do
            for delay in 0 2 4; do
              sleep "$delay"
              if status=$(curl --fail -sS -o /dev/null --max-time 5 --write-out '%{http_code}' "$url") &&
                [[ "$status" == 200 ]]; then
                continue 2
              fi
            done
            printf '::warning::%s did not return HTTP 200 within the retry window.\n' "$url"
          done
