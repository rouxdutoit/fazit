# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

"on":
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: uv build
      - name: Check built version
        run: |
          shopt -s nullglob
          distributions=(dist/*.tar.gz dist/*.whl)
          version="${GITHUB_REF_NAME#v}"
          if [[ ${#distributions[@]} -ne 2 ||
                ${distributions[0]} != "dist/fazit-$version.tar.gz" ||
                ${distributions[1]} != "dist/fazit-$version-"*.whl ]]; then
            printf 'Built distributions do not match tag %s.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/fazit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
