name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.x"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pytest -q tests/test_simulation.py --hypothesis-profile=deep
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      - run: uv run fazit demo --lang de
      - run: uv run fazit demo --lang en
      - run: uv run python site/check_site.py
      - name: Test unpacked source distribution
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          fazit_archive_dir=$(mktemp -d)
          uv build --sdist --out-dir "$fazit_archive_dir"
          tar -xzf "$fazit_archive_dir"/*.tar.gz -C "$fazit_archive_dir"
          cd "$fazit_archive_dir"/fazit-*/
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
          uv run pytest -q -rs
