codes:
  collectors:
    - licences
    - directory
    - mailbox_usage
    - onedrive_usage
    - sharepoint_site_usage
    - teams_usage
    - exchange_recipients
  sources:
    - sample.licences
    - sample.directory
    - sample.mailbox_usage
    - sample.onedrive_usage
    - sample.sharepoint_site_usage
    - sample.teams_usage
    - sample.exchange_recipients
    - sample.interview
    - interview
    - inputs_yaml
  reasons:
    - not_in_export
    - permission_denied
    - not_licensed
    - not_collected_in_this_version
    - answer_not_provided
    - source_not_supplied
    - needs_recipient_export
    - collector_skipped
    - not_in_scan
    - licensed_use_not_measured
    - licence_not_classified
    - coverage_partial
    - coverage_unknown
    - not_established
    - not_recognised
  permissions:
    - Reports.Read.All
    - User.Read.All
    - Group.Read.All
    - Organization.Read.All
    - Sites.Read.All
    - Files.Read.All
    - Team.ReadBasic.All
    - Channel.ReadBasic.All
    - DeviceManagementManagedDevices.Read.All
