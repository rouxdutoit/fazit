reason:
  not_in_export:
    label: The export does not contain this figure.
    fix: Check the export options and supply an export that includes it.
  permission_denied:
    label: The collection method lacked permission.
    fix: Ask an administrator to check the required read permissions.
  not_licensed:
    label: The required licence was unavailable.
    fix: Confirm which licences the organisation holds.
  not_collected_in_this_version:
    label: This version does not collect this figure.
    fix: Ask the person responsible for the service for the information.
  answer_not_provided:
    label: The answer is missing.
    fix: Find out the answer and enter it in the inputs file.
  source_not_supplied:
    label: The data source was missing.
    fix: Supply the required export and rebuild the report.
  needs_recipient_export:
    label: Mailbox usage alone cannot establish the number of shared mailboxes.
    fix: Supply an Exchange recipient export that includes the mailbox type.
  collector_skipped:
    label: The collection method did not run.
    fix: Check the reason in the appendix and supply the missing evidence.
  not_in_scan:
    label: The scan does not include this finding.
    fix: Check whether the source can supply this figure.
  licensed_use_not_measured:
    label: The licence includes this service, and its use is unverified.
    fix: Ask the service owner how the organisation uses it.
  licence_not_classified:
    label: This tool could not classify the licence.
    fix: Check the product and service plan against the licensing reference.
  licence_plan_list_missing:
    label: An assigned product has no service plan list in the inventory.
    fix: Supply the list of service plans for that product.
  coverage_partial:
    label: The measurement covers only part of the scope.
    fix: Check the remaining items before drawing a conclusion about the whole scope.
  coverage_unknown:
    label: The extent of the measurement is unknown.
    fix: Confirm which items the measurement covered or supply a complete figure.
  confirmation_conflict:
    label: The measurement and the supplied answer disagree.
    fix: Check that both refer to the same scope and correct the evidence.
  not_established:
    label: The available evidence leaves the answer open.
    fix: Review the finding with the person responsible for the service.
  not_recognised:
    label: This version does not recognise the reason.
    fix: Check the export and the tool version.
