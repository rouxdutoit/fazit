# SPDX-License-Identifier: AGPL-3.0-or-later
profile: nextcloud
label: {en: Nextcloud Hub, de: Nextcloud Hub}
description:
  en: Functions covered by the documented Nextcloud Hub applications and gaps that require separate work.
  de: Dokumentierte Funktionen der Anwendungen in Nextcloud Hub und Lücken, die gesondert bearbeitet werden müssen.
product_profile: true
no_function: [licences]
functions:
  - function: identity_management
    workload: directory
    microsoft: {en: Microsoft Entra ID user and group management, de: Benutzer- und Gruppenverwaltung in Microsoft Entra ID}
    replacement: {en: Nextcloud user and group administration, de: Benutzer- und Gruppenverwaltung in Nextcloud}
    coverage: in_suite_with_limits
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/configuration_user/user_configuration.html
    checked_on: "2026-11-21"
    note:
      en: Nextcloud manages accounts and groups within its installation. An organisation-wide directory for other systems needs separate assessment.
      de: Nextcloud verwaltet Konten und Gruppen in der eigenen Installation. Ein organisationsweiter Verzeichnisdienst für weitere Systeme ist gesondert zu prüfen.
  - function: mail_and_calendar
    workload: mail
    microsoft: {en: Exchange Online mail and calendar, de: E-Mail und Kalender in Exchange Online}
    replacement: {en: Nextcloud Mail and Calendar with a separate mail server, de: Nextcloud Mail und Calendar mit einem gesonderten Mailserver}
    coverage: in_suite_with_limits
    reference_url: https://nextcloud.com/hub/
    checked_on: "2026-11-21"
    note:
      en: The suite provides a mail client and shared calendars. Mail delivery and mailbox storage require a separate mail server.
      de: Das Paket enthält ein E-Mail-Programm und gemeinsame Kalender. Für die Zustellung und Speicherung der E-Mails ist ein gesonderter Mailserver erforderlich.
  - function: personal_files
    workload: onedrive
    microsoft: {en: OneDrive personal file storage and sync, de: Persönliche Dateiablage und Synchronisierung in OneDrive}
    replacement: {en: Nextcloud Files, de: Nextcloud Files}
    coverage: in_suite
    reference_url: https://docs.nextcloud.com/server/stable/user_manual/en/
    checked_on: "2026-11-21"
  - function: team_files
    workload: sharepoint
    microsoft: {en: SharePoint team file libraries, de: Dateiablagen für Teams in SharePoint}
    replacement: {en: Team Folders in Nextcloud Files, de: Team Folders in Nextcloud Files}
    coverage: in_suite_with_limits
    reference_url: https://apps.nextcloud.com/apps/groupfolders
    checked_on: "2026-11-21"
    note:
      en: Team Folders provides shared folders with access rules. SharePoint site structure and library rules need a separate review.
      de: Team Folders bietet gemeinsame Ordner mit Zugriffsregeln. Prüfen Sie die Struktur der SharePoint-Websites und die Regeln der Bibliotheken gesondert.
  - function: sharepoint_workflows
    workload: sharepoint
    microsoft: {en: SharePoint workflows, de: SharePoint-Workflows}
    replacement: {en: Rebuild supported workflows with Nextcloud Flow, de: Unterstützte Arbeitsabläufe mit Nextcloud Flow neu erstellen}
    coverage: not_available
    reference_url: https://nextcloud.com/flow/
    checked_on: "2026-11-21"
    note:
      en: Flow builds new workflows. Its documentation gives no way to transfer existing SharePoint triggers, approvals or workflow definitions directly.
      de: Mit Flow lassen sich neue Arbeitsabläufe erstellen. Eine direkte Übernahme vorhandener SharePoint-Auslöser, Genehmigungen oder Ablaufdefinitionen ist nicht dokumentiert.
  - function: chat
    workload: teams
    microsoft: {en: Microsoft Teams chat, de: Chat in Microsoft Teams}
    replacement: {en: Nextcloud Talk, de: Nextcloud Talk}
    coverage: in_suite
    reference_url: https://docs.nextcloud.com/server/stable/user_manual/en/talk/conversations.html
    checked_on: "2026-11-21"
  - function: video_meetings
    workload: teams
    microsoft: {en: Microsoft Teams video meetings, de: Videobesprechungen in Microsoft Teams}
    replacement: {en: Nextcloud Talk, de: Nextcloud Talk}
    coverage: in_suite
    reference_url: https://nextcloud.com/hub/
    checked_on: "2026-11-21"
  - function: teams_chat_history
    workload: teams
    microsoft: {en: Teams chat history, de: Chatverlauf aus Teams}
    replacement: {en: Separate decision on retaining past chats, de: Gesonderte Entscheidung zur Aufbewahrung bisheriger Chats}
    coverage: not_available
    reference_url: https://nextcloud.com/migrate/
    checked_on: "2026-11-21"
    need_finding: teams.chat_history_must_be_kept
    note:
      en: The migration overview describes moving chat and meetings to Talk. It does not document importing past Teams messages with their authors and timestamps into Talk.
      de: Die Migrationsübersicht beschreibt den Wechsel zu Talk für Chat und Besprechungen. Ein Import bisheriger Teams-Nachrichten mit Angaben zu Absendern und Zeitpunkten ist dort nicht dokumentiert.
  - function: office_editing
    workload: office_files
    microsoft: {en: Editing Microsoft Office documents, de: Bearbeitung von Microsoft-Office-Dateien}
    replacement: {en: Nextcloud Office, de: Nextcloud Office}
    coverage: in_suite_with_limits
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/office/index.html
    checked_on: "2026-11-21"
    note:
      en: The administrator guide describes browser editing through Euro-Office or Collabora Online. It requires an editing service, and complex documents need to be tested with the chosen editor.
      de: Das Administrationshandbuch beschreibt die Bearbeitung im Browser mit Euro-Office oder Collabora Online. Dafür ist ein Bearbeitungsdienst erforderlich. Prüfen Sie komplexe Dokumente mit dem gewählten Editor.
  - function: vba_macros
    workload: office_files
    microsoft: {en: VBA macros in Office files, de: VBA-Makros in Office-Dateien}
    replacement: {en: Separate conversion or redevelopment, de: Gesonderte Konvertierung oder Neuentwicklung}
    coverage: not_available
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/office/euro-office/configuration.html
    checked_on: "2026-11-21"
    note:
      en: Euro-Office documents an option for running document macros. That leaves compatibility with existing VBA automation unverified.
      de: Für Euro-Office ist eine Einstellung zur Ausführung von Dokumentmakros beschrieben. Die Kompatibilität mit bestehenden VBA-Automatisierungen bleibt ungeklärt.
  - function: device_management
    workload: device_management
    microsoft: {en: Device management with Microsoft Intune, de: Geräteverwaltung mit Microsoft Intune}
    replacement: {en: Separate device management service, de: Gesonderte Lösung zur Geräteverwaltung}
    coverage: not_available
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/
    checked_on: "2026-11-21"
    need_finding: device_management.in_use
    note:
      en: The core components include clients for syncing files. Device enrolment and system-wide device policies are outside that scope.
      de: Zu den Kernkomponenten gehören Programme zur Dateisynchronisierung. Die Registrierung von Geräten und systemweite Geräterichtlinien liegen außerhalb dieses Funktionsumfangs.
  - function: desktop_operating_system
    workload: device_management
    microsoft: {en: Microsoft Windows desktop operating system, de: Arbeitsplatzbetriebssystem Microsoft Windows}
    replacement: {en: Separately managed workstation operating system, de: Separat verwaltetes Betriebssystem für Arbeitsplatzrechner}
    coverage: not_available
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/
    checked_on: "2026-11-21"
    note:
      en: Nextcloud provides clients for existing desktop operating systems. A workstation operating system is outside the suite's scope.
      de: Nextcloud stellt Programme für vorhandene Arbeitsplatzbetriebssysteme bereit. Das Betriebssystem für die Arbeitsplatzrechner ist gesondert bereitzustellen.
  - function: windows_applications
    workload: windows_software
    microsoft: {en: Running Windows-only applications, de: Betrieb reiner Windows-Anwendungen}
    replacement: {en: Separate hosting or replacement of each application, de: Gesonderter Betrieb oder Ersatz der einzelnen Anwendungen}
    coverage: not_available
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/
    checked_on: "2026-11-21"
    note:
      en: The server and desktop clients listed in the guide do not provide an environment for running existing Windows-only applications.
      de: Der im Handbuch beschriebene Server und die Clients stellen keine Umgebung für den Betrieb vorhandener reiner Windows-Anwendungen bereit.
  - function: automation_and_low_code
    workload: power_platform
    microsoft: {en: Power Platform automation and low-code applications, de: Automatisierung und Low-Code-Anwendungen mit Power Platform}
    replacement: {en: Nextcloud Flow and Nextcloud Tables, de: Nextcloud Flow und Nextcloud Tables}
    coverage: in_suite_with_limits
    reference_url: https://nextcloud.com/flow/
    checked_on: "2026-11-21"
    note:
      en: Flow and Tables cover new workflows and structured data. Advanced automation requires the Windmill component. Existing Power Platform apps and connectors need individual review and redevelopment.
      de: Flow und Tables unterstützen neue Arbeitsabläufe und strukturierte Daten. Für erweiterte Automatisierung ist die Komponente Windmill erforderlich. Prüfen Sie vorhandene Power-Platform-Anwendungen und Anbindungen einzeln auf den Aufwand einer Neuentwicklung.
  - function: telephony
    workload: telephony
    microsoft: {en: Teams Phone and public telephone calling, de: Teams Phone und Anrufe ins öffentliche Telefonnetz}
    replacement: {en: Nextcloud Talk with a SIP gateway, de: Nextcloud Talk mit einem SIP-Gateway}
    coverage: in_suite_with_limits
    reference_url: https://docs.nextcloud.com/server/stable/user_manual/en/talk/conversations.html
    checked_on: "2026-11-21"
    note:
      en: Talk supports incoming and outgoing calls over a SIP gateway. Check the organisation's requirements for number routing and call queues separately.
      de: Talk unterstützt eingehende und ausgehende Anrufe über ein SIP-Gateway. Prüfen Sie Anforderungen an Rufnummernweiterleitung und Warteschleifen gesondert.
  - function: single_sign_on
    workload: identity_access
    microsoft: {en: Microsoft Entra single sign-on, de: Zentrale Anmeldung über Microsoft Entra}
    replacement: {en: OIDC Identity Provider app for Nextcloud, de: App OIDC Identity Provider für Nextcloud}
    coverage: open_source_community
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/configuration_user/user_auth_oidc.html
    checked_on: "2026-11-21"
    note:
      en: The community app lets other services use Nextcloud accounts if they support OpenID Connect. Review each application's authentication and access policies.
      de: Über die Community-App können andere Dienste Nextcloud-Konten verwenden, wenn sie OpenID Connect unterstützen. Prüfen Sie Anmeldung und Zugriffsrichtlinien für jede Anwendung einzeln.
  - function: security_and_compliance
    workload: security_compliance
    microsoft: {en: Microsoft 365 protection and retention controls, de: Schutz und Aufbewahrung in Microsoft 365}
    replacement: {en: Nextcloud file protection and retention controls, de: Dateischutz und Aufbewahrungseinstellungen in Nextcloud}
    coverage: in_suite_with_limits
    reference_url: https://docs.nextcloud.com/server/stable/admin_manual/file_workflows/retention.html
    checked_on: "2026-11-21"
    note:
      en: The retention app applies age rules to tagged files. Organisation-wide retention and holds for legal proceedings need separate assessment.
      de: Die Aufbewahrungs-App wendet Fristen auf gekennzeichnete Dateien an. Organisationsweite Aufbewahrung und Sperren für Rechtsverfahren sind gesondert zu prüfen.
  - function: forms_tasks_bookings
    workload: small_apps
    microsoft: {en: "Microsoft Forms, Planner and Bookings", de: "Microsoft Forms, Planner und Bookings"}
    replacement: {en: "Nextcloud Forms, Deck and Calendar", de: "Nextcloud Forms, Deck und Calendar"}
    coverage: in_suite_with_limits
    reference_url: https://nextcloud.com/groupware/
    checked_on: "2026-11-21"
    note:
      en: Forms supports surveys, Deck provides task boards, and Calendar supports appointment bookings. Check which existing forms, boards and bookings have to be recreated.
      de: Forms unterstützt Umfragen, Deck bietet Aufgabenübersichten und Calendar ermöglicht Terminbuchungen. Prüfen Sie, welche bestehenden Formulare, Aufgabenübersichten und Buchungen neu angelegt werden müssen.
  - function: application_integrations
    workload: integrations
    microsoft: {en: Integrations with Microsoft 365 applications, de: Anbindungen an Microsoft-365-Anwendungen}
    replacement: {en: Nextcloud application interfaces and integrations, de: Schnittstellen und Anbindungen für Nextcloud}
    coverage: in_suite_with_limits
    reference_url: https://nextcloud.com/hub/
    checked_on: "2026-11-21"
    note:
      en: Nextcloud provides application interfaces and add-ons. Check each connection to an existing business application separately.
      de: Nextcloud stellt Schnittstellen und Erweiterungen bereit. Prüfen Sie jede Anbindung einer vorhandenen Fachanwendung gesondert.
