    hosting: Hosting
    operations: Betrieb des Zielsystems
    other_recurring: Sonstige laufende Kosten des Zielsystems
    one_time_migration: Einmalige Migration
    application_adaptation: Anpassung von Anwendungen
    external_advice: Externe Beratung
    training: Schulung
    productivity_loss: Kosten durch Produktivitätsverluste
    parallel_running: Bisherige Microsoft-Lizenzen im Parallelbetrieb
  formulas_title: Berechnung der Kosten
  formulas:
    - Beim Verbleib fallen die jährlichen Microsoft-Lizenzkosten und die sonstigen bisherigen IT-Kosten jeweils über fünf Jahre an. Die drei Kostenblöcke der Umstellung betragen null.
    - Bei beiden Ausstiegsszenarien ziehen Sie die Monate des Parallelbetriebs von 60 ab. Multiplizieren Sie die Jahreskosten der beibehaltenen Microsoft-Lizenzen mit den verbleibenden Monaten und teilen Sie das Ergebnis durch 12.
    - Multiplizieren Sie den monatlichen Hostingpreis pro Person mit der Zahl der Nutzenden und mit 60. Das Hosting beginnt im ersten Monat. Die Jahreskosten für Betrieb, sonstige Kosten des Zielsystems und sonstige bisherige IT-Kosten werden jeweils mit fünf multipliziert.
    - Die direkten Projektkosten umfassen einmalige Migration, Anpassung von Anwendungen, externe Beratung und Schulung. Die Schulungskosten ergeben sich aus Schulungstagen pro Person mal Tagessatz pro Person mal Zahl der zu schulenden Personen.
    - Für die Produktivitätsverluste gilt der dafür eingegebene Betrag.
    - Für den Parallelbetrieb multiplizieren Sie die bisherigen jährlichen Microsoft-Lizenzkosten mit den Monaten des Parallelbetriebs und teilen das Ergebnis durch 12.
    - Die Gesamtkosten für fünf Jahre ergeben sich aus den laufenden Kosten und den drei Kostenblöcken der Umstellung. Für den Vergleich werden von den Gesamtkosten jedes Szenarios die Gesamtkosten des Verbleibs abgezogen.
    - Ist ein Faktor null, beträgt die Kostenposition null. Fehlt eine für die Berechnung erforderliche Angabe, bleibt das Ergebnis unbekannt.
