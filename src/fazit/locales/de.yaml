reason:
  not_in_export:
    label: Die Angabe fehlt im Export.
    fix: Erfragen Sie die fehlende Angabe bei der fachlich verantwortlichen Stelle. Tragen Sie sie in die Eingabedatei ein, sofern dort ein Feld dafür vorgesehen ist.
  permission_denied:
    label: Die Leseberechtigung für die Erhebung fehlte.
    fix: Lassen Sie die erforderlichen Berechtigungen durch die Administration prüfen.
  not_licensed:
    label: Die erforderliche Lizenz war nicht verfügbar.
    fix: Prüfen Sie, über welche Lizenzen Ihre Organisation verfügt.
  not_collected_in_this_version:
    label: Diese Programmversion erhebt die Angabe nicht.
    fix: Fragen Sie bei der für den Dienst zuständigen Stelle nach.
  answer_not_provided:
    label: Die Angabe fehlt.
    fix: Klären Sie die Frage und tragen Sie die Antwort in die Eingabedatei ein.
  source_not_supplied:
    label: Die Datenquelle lag nicht vor.
    fix: Klären Sie, aus welcher Quelle die fehlende Angabe stammt. Fehlt sie in der Erhebungsdatei und in der Eingabedatei, bleibt sie unbekannt.
  needs_recipient_export:
    label: Aus der Postfachnutzung allein geht die Zahl der freigegebenen Postfächer nicht hervor.
    fix: Lassen Sie die Zahl gesondert von der für E-Mail zuständigen Stelle ermitteln. Im Bericht bleibt sie unbekannt.
  collector_skipped:
    label: Das Erhebungsverfahren wurde nicht ausgeführt.
    fix: Prüfen Sie den Grund im Anhang und reichen Sie die fehlenden Daten nach.
  not_in_scan:
    label: Das Merkmal fehlt in der Erhebung.
    fix: Prüfen Sie, ob die Datenquelle diese Angabe liefern kann.
  licensed_use_not_measured:
    label: Die Lizenz umfasst den Dienst, dessen Nutzung noch ungeklärt ist.
    fix: Klären Sie mit der zuständigen Stelle, wie Ihre Organisation den Dienst nutzt.
  licence_products_missing:
    label: Im Lizenzbestand sind keine Produkte erfasst.
    fix: Prüfen Sie die Quelle und reichen Sie eine vollständige Liste der Lizenzprodukte nach.
  licence_not_classified:
    label: Das Programm konnte einen Serviceplan nicht einordnen.
    fix: Gleichen Sie Produkt und Serviceplan mit der Lizenzreferenz ab und aktualisieren Sie den Serviceplankatalog.
  licence_plan_list_missing:
    label: Für ein zugewiesenes Lizenzprodukt fehlt die Liste der Servicepläne.
    fix: Reichen Sie die Liste der Servicepläne für dieses Produkt nach.
  licence_plan_list_incomplete:
    label: Die Serviceplanliste für ein bekanntes Lizenzprodukt ist unvollständig.
    fix: Lassen Sie durch die Lizenzverwaltung prüfen, welche Servicepläne zum Produkt gehören.
  licence_assignments_conflict:
    label: Die Lizenzzuweisungen widersprechen der Zahl der lizenzierten Konten.
    fix: Gleichen Sie Verzeichnis und Lizenzbestand derselben Organisation ab und erheben Sie die Zahlen erneut.
  licence_directory_unverified:
    label: Die Lizenzzuweisungen sind durch das Verzeichnis nicht bestätigt.
    fix: Gleichen Sie die Zahl der lizenzierten Konten mit dem Lizenzbestand ab.
  directory_population_unverified:
    label: Die Erhebung weist keine vollständige Prüfung der Verzeichniskonten nach.
    fix: Prüfen Sie alle Verzeichniskonten in derselben Erhebung und geben Sie die Gesamtzahl an.
  coverage_partial:
    label: Die Erhebung deckt nur einen Teil des vorgesehenen Bestands ab.
    fix: Prüfen Sie die übrigen Elemente, bevor Sie Rückschlüsse auf den gesamten Bestand ziehen.
  coverage_unknown:
    label: Der Umfang der Erhebung ist unbekannt.
    fix: Klären Sie, welche Elemente erfasst wurden, oder reichen Sie eine vollständige Angabe nach.
  confirmation_conflict:
    label: Die Erhebung und die eingetragene Antwort stimmen nicht überein.
    fix: Prüfen Sie, ob sich beide auf denselben Umfang beziehen, und korrigieren Sie die Angaben.
  provided_answers_conflict:
    label: Die eingetragenen Antworten widersprechen einander.
    fix: Klären Sie beide Antworten mit der zuständigen Stelle und korrigieren Sie die Angaben in den Dateien.
  not_established:
    label: Die vorliegenden Daten lassen die Frage offen.
    fix: Klären Sie die Angabe mit der für den Dienst zuständigen Stelle.
  not_recognised:
    label: Diese Programmversion kennt den Grund nicht.
    fix: Prüfen Sie die Version des Erhebungsprogramms und den Begründungscode in der Erhebungsdatei.
